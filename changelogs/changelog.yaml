---
ancestor: null
releases:
  1.0.5:
    release_date: "2026-09-04"
    changes:
      bugfixes:
        - >-
          security — the sysctl override drop-in now wins at boot. It was
          /etc/sysctl.d/99-nkg-proxmox-overrides.conf; konstruktoid writes
          /usr/lib/sysctl.d/zz-main-hardening.conf, and systemd-sysctl
          applies every drop-in from /etc and /usr/lib as one list sorted
          by basename, so 99-* lost to zz-* on every boot. The values held
          after the play (the task reloads its own file last) and were back
          to 0/0 after the next reboot, at which point onboot unprivileged
          containers failed to start — observed on four hosts on 2026-09-04.
          Now /etc/sysctl.d/zzz-nkg-proxmox-overrides.conf, which sorts
          after any zz-*; the old file is removed.
        - >-
          host_config — same defect in the opt-in networking drop-in:
          host_config_sysctl_path now defaults to
          /etc/sysctl.d/zzz-proxmox-networking.conf, so ip_forward=1 and
          proxy_arp survive a reboot on a host that also ran the security
          role (konstruktoid sets ip_forward=0 in zz-main-hardening.conf).
          The old default file is removed when the path is not the old one.
  1.0.4:
    release_date: "2026-08-31"
    changes:
      bugfixes:
        - >-
          api_access — bootstrap no longer replaces an existing admin user's
          password with a lock. `password: "!"` is right for a NEW account
          (it authenticates by key and escalates via the NOPASSWD drop-in)
          but the user module applies it on every run, so a host where the
          user already existed with a working password had that password
          locked. The very next task needs become, so the run then died with
          "Incorrect sudo password" before reaching the sudoers drop-in that
          would have made the password unnecessary — leaving the account
          unable to escalate at all, recoverable only from the host console.
          Fixed with update_password on_create. This is exactly the case
          `--tags bootstrap` exists for, and it was observed on two live
          hosts.
  1.0.3:
    release_date: "2026-08-31"
    changes:
      bugfixes:
        - >-
          api_access, host_config — mark the read-only discovery commands
          check_mode false, so `--check` works at all. Without it those tasks
          were skipped under --check, later tasks parsed their empty
          registers, and a dry run failed on a healthy host (from_json on an
          empty string in api_access; an empty privilege vocabulary in the
          consuming playbook). A dry run was impossible — which is the run an
          operator is told to do first.
        - >-
          host_config — the vmbr0/vmbr1 bridge verifications now run under
          --check as well. They are read-only and their whole purpose is the
          failed_when; skipped, a dry run reported healthy bridges it had
          never looked at.
  1.0.2:
    release_date: "2026-06-16"
    changes:
      bugfixes:
        - repos — refresh the apt cache via a handler notified on repo change, instead of an always-changed update_cache task (idempotent re-runs).
        - security — exclude rsync/rpcbind/git from konstruktoid's packages_blocklist; proxmox-ve depends on rsync and rpcbind, so removing them cascades into uninstalling Proxmox.
        - requirements/galaxy — declare community.crypto (a konstruktoid.hardening dependency Ansible resolves at parse time), so the security role works on a fresh install.
        - repos — disable the stock enterprise pve/ceph repos before any apt call, so a no-subscription host's 401 no longer breaks apt update.
        - host_config — put /usr/sbin on PATH for the apparmor_parser unload so it resolves under a non-login su.
        - api_access — accept the SSH key as a file path (api_access_*_ssh_key_file) and trim it; full-path visudo and no apt-update in bootstrap.
      minor_changes:
        - api_access — bootstrap (Linux IaC user) split into bootstrap.yml (--tags bootstrap); added a container molecule scenario, now in CI.
        - playbooks — site.yml and the new api_access.yml put /usr/sbin on PATH play-wide (Proxmox CLI + konstruktoid under su).
  1.0.1:
    release_date: "2026-06-16"
    changes:
      minor_changes:
        - security — disable konstruktoid USBGuard by default (manage_usbguard=false); it blocks USB on a hypervisor and breaks console/passthrough.
        - security — re-assert Proxmox-required sysctls after hardening (security_sysctl_overrides), re-enabling unprivileged user namespaces so unprivileged LXC keeps working.
  1.0.0:
    release_date: "2026-06-16"
    changes:
      release_summary: >-
        Initial release. Roles to provision, configure, secure and harden
        Proxmox VE: repos, host_base, host_config, security (konstruktoid
        wrapper), crowdsec, api_access, and hetzner_image (bare-metal install).
